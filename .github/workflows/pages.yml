name: FUTSIM Weekly Monday Data & Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/data/snapshot.json"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: futsim-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test 100+ unseen chronological matches first
        run: python scripts/validate_walkforward.py || echo "::warning::Backtest source unavailable; earlier validation preserved"
      - name: Run second disjoint 500 historical predictions
        run: python scripts/validate_second500.py
      - name: Update CC0 public results and attributed corners
        run: python scripts/update_cc0.py || echo "::warning::Source unavailable; preserving last confirmed snapshot"
      - name: Verify free API-Football integration without credentials
        run: |
          python -m py_compile scripts/update_api_football.py
          python scripts/update_api_football.py --self-test
      - name: Get optional free API-Football injuries and lineups
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python scripts/update_api_football.py
      - name: Check optional public xG and player xA source, obey robots restrictions
        run: python scripts/update_understat.py
      - name: Test free Premier League FPL xG and xA player feed
        run: python scripts/update_fpl_xg.py
      - name: Materialize all-team Monday offline statistics
        run: python scripts/build_weekly.py
      - name: Validate model, Python and published UI
        run: |
          python -m py_compile scripts/validate_walkforward.py scripts/update_cc0.py scripts/update_understat.py scripts/update_fpl_xg.py scripts/build_weekly.py scripts/validate_second500.py scripts/check_site.py
          python scripts/check_site.py
          node scripts/test_xg_preserve.cjs
      - name: Save a verified nonempty update
        run: |
          git config user.name "FUTSIM Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/snapshot.json docs/data/model_validation.json docs/data/model_params.json docs/data/api_football.json docs/data/xg_source.json docs/data/fpl_xg.json docs/data/weekly_team_stats.json docs/data/validation_second500.json
          if ! git diff --cached --quiet; then
            git commit -m "data: updated verified football results [skip ci]"
            git push || echo "::warning::Data commit rejected; site build still proceeds"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
