name: FUTSIM Daily Public Odds & Fixtures
on:
  push:
    branches: [main]
    paths:
      - "scripts/update_public_odds.py"
      - ".github/workflows/daily-odds.yml"
  schedule:
    - cron: "12 6 * * *"
    - cron: "12 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: futsim-daily-odds
  cancel-in-progress: true
jobs:
  daily-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate date and odds parser locally
        run: |
          python -m py_compile scripts/update_public_odds.py scripts/update_api_football.py
          python scripts/update_public_odds.py --self-test
      - name: Refresh today's eligible fixtures
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python scripts/update_api_football.py
      - name: Search today's published international market odds
        run: python scripts/update_public_odds.py
      - name: Save daily date-matched public odds cache
        run: |
          git config user.name "FUTSIM Daily Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/daily_market_odds.json docs/data/api_football.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh daily fixture and published market odds [skip ci]"
            git push
          fi
